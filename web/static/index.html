<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>agentic-sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>agentic-sim</h1>
    <div class="run-picker">
      <label for="run-select">Run</label>
      <select id="run-select"><option value="">— select a run —</option></select>
      <button id="refresh-runs" type="button">Refresh</button>
      <span id="run-status"></span>
    </div>
  </header>

  <main>
    <section id="start-run">
      <h2>Start a run</h2>
      <form id="start-run-form">
        <div class="field-row">
          <label>Duration (ms) <input type="number" id="duration-ms" value="30000" min="1" required /></label>
          <label>Tick (ms) <input type="number" id="tick-ms" value="1000" min="1" required /></label>
        </div>
        <label for="agents-json">Agents / locations (JSON body fields merged with duration/tick above)</label>
        <textarea id="agents-json" rows="14" spellcheck="false"></textarea>
        <button type="submit">Start run</button>
        <span id="start-run-error" class="error"></span>
      </form>
    </section>

    <section id="hud">
      <h2>World</h2>
      <div id="agent-table-container">
        <p class="empty-state">No run selected.</p>
      </div>
    </section>

    <section id="event-log-section">
      <h2>Event log</h2>
      <ul id="event-log"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
